<!--
  THE DAILY — My Menu  ·  vibrant / retro-sticker edition
  A print-ready, café-style menu of everything Pranjal cooks.

  HOW TO PRINT
  ------------
  Open in Chrome → Cmd/Ctrl+P → "Save as PDF".
  Paper: A4 · Margins: None/Default · Background graphics: ON.

  HOW TO EDIT
  -----------
  All dishes live in the CATALOGUE object in the <script> at the bottom.
  Structure: meal (Lunch/Dinner/Drinks) → cuisine group → items.
  Each group has its own box colour (`bg`), text colour (`ink`) and an
  illustration key (`illo`). Change data there; the layout redraws itself.

  Symbols:  ◆ house special (solo)   ♥ for two (shared)   NEW = saved, not yet in rotation
-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>THE DAILY — My Menu</title>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Bungee&family=Fredoka:wght@400;500;600;700&family=Nunito:ital,wght@0,500;0,700;0,800;0,900;1,600;1,700&display=swap');

  :root{
    --outline: #241b2e;          /* shared dark outline + hard shadow  */
    --shadow: 5px 5px 0 var(--outline);
    --shadow-sm: 3px 3px 0 var(--outline);
    --page-bg: #fff;             /* set below */
    --cream: #fff6df;

    --display: "Bungee", system-ui, sans-serif;   /* chunky retro   */
    --round:   "Fredoka", system-ui, sans-serif;  /* bubbly rounded */
    --body:    "Nunito", system-ui, sans-serif;   /* clean sans     */

    --page-w: 210mm;
    --page-h: 297mm;
    --pad: 13mm;
  }

  *{ box-sizing: border-box; }
  html{ background:#e9c8dd; }
  body{ margin:0; font-family:var(--body); color:var(--outline); -webkit-font-smoothing:antialiased; }

  /* ---------------------------------------------------------------- page */
  .page{
    position:relative;
    width:var(--page-w);
    height:var(--page-h);
    margin:9mm auto;
    padding:var(--pad);
    overflow:hidden;
    background:#fff7e6;
    background-image:
      radial-gradient(circle at 12% 88%, #ffe1ef 0 0),
      radial-gradient(#ffd9a8 1.1px, transparent 1.2px);
    background-size: 100% 100%, 16px 16px;
    box-shadow:0 8px 34px rgba(0,0,0,.25);
  }
  .page__in{ position:relative; height:100%; z-index:2; display:flex; flex-direction:column; }

  /* scattered sparkle stars (decoration layer) */
  .spark{ position:absolute; z-index:1; pointer-events:none; }

  /* ---------------------------------------------------------------- cover */
  .cover{ background:#ff4f9a;
    background-image:
      radial-gradient(circle at 50% 50%, rgba(255,255,255,.16) 0 0),
      radial-gradient(rgba(255,255,255,.35) 1.4px, transparent 1.5px);
    background-size:100% 100%, 20px 20px;
  }
  .cover__frame{
    flex:1; border:3px solid var(--outline); border-radius:26px;
    background:#fff6df; box-shadow:var(--shadow);
    padding:12mm 11mm; display:flex; flex-direction:column; position:relative; overflow:hidden;
  }
  .cover__ribbon{
    align-self:flex-start;
    font-family:var(--round); font-weight:700; font-size:11pt; letter-spacing:.02em;
    background:#ffd23c; color:var(--outline);
    border:3px solid var(--outline); border-radius:999px;
    padding:3px 16px; box-shadow:var(--shadow-sm);
  }
  .cover__logo{
    font-family:var(--display); line-height:.92; letter-spacing:.01em;
    font-size:82pt; margin:8mm 0 0;
  }
  .cover__logo .l1{ color:#ff4f9a; }
  .cover__logo .l2{ color:#2fb56b; }
  .cover__logo .l1, .cover__logo .l2{
    -webkit-text-stroke:2.5px var(--outline); text-shadow:4px 4px 0 var(--outline);
    display:block;
  }
  .cover__tag{
    font-family:var(--round); font-style:italic; font-weight:500;
    font-size:16pt; margin-top:7mm; max-width:135mm; line-height:1.35; color:var(--outline);
  }
  .cover__ritual{
    margin-top:6mm; background:#59b7f5; color:var(--outline);
    border:3px solid var(--outline); border-radius:16px; box-shadow:var(--shadow-sm);
    padding:5mm 6mm; font-family:var(--body); font-weight:700; font-size:11pt; max-width:120mm;
  }
  .cover__ritual b{ font-family:var(--round); }
  .cover__spacer{ flex:1; }
  .legend{ display:flex; flex-wrap:wrap; gap:5mm; }
  .legend .chip{
    display:inline-flex; align-items:center; gap:6px;
    background:#fff; color:var(--outline);
    border:2.5px solid var(--outline); border-radius:999px;
    padding:4px 13px; font-family:var(--body); font-weight:800; font-size:9.5pt;
    box-shadow:2px 2px 0 var(--outline);
  }
  .legend .chip .s{ font-size:12pt; line-height:1; }
  .cover__foot{
    margin-top:6mm; display:flex; justify-content:space-between; align-items:center;
    font-family:var(--display); font-size:9pt; letter-spacing:.06em; color:var(--outline);
  }

  /* ------------------------------------------------------------- banners */
  .banner{
    display:flex; align-items:center; gap:6mm;
    border:3px solid var(--outline); border-radius:20px; box-shadow:var(--shadow);
    padding:5mm 8mm; margin-bottom:7mm; position:relative;
  }
  .banner__title{ font-family:var(--display); font-size:34pt; line-height:.9; color:var(--outline); }
  .banner__kick{ font-family:var(--round); font-weight:600; font-size:11pt; opacity:.85; margin-top:1mm; }
  .banner__illo{ margin-left:auto; }
  .banner__illo svg{ width:26mm; height:26mm; display:block; }

  /* --------------------------------------------------------------- cards */
  .cards{ display:grid; grid-template-columns:1fr 1fr; gap:7mm; align-content:start; }
  .card{
    --bg:#fff; --ink:var(--outline);
    background:var(--bg); color:var(--ink);
    border:3px solid var(--outline); border-radius:18px; box-shadow:var(--shadow);
    padding:6mm 6mm 6mm; position:relative; overflow:hidden;
    break-inside:avoid;
  }
  .card--wide{ grid-column:1 / -1; }
  .card__illo{ position:absolute; top:-3mm; right:-3mm; opacity:.9; }
  .card__illo svg{ width:24mm; height:24mm; display:block; }
  .card__title{
    font-family:var(--round); font-weight:700; font-size:19pt; line-height:1;
    color:var(--ink); padding-right:20mm;
  }
  .card__tag{
    font-family:var(--body); font-weight:800; font-size:8pt; letter-spacing:.14em; text-transform:uppercase;
    color:var(--ink); opacity:.72; margin:1.5mm 0 4mm;
  }
  .card__items{ display:grid; grid-template-columns:1fr; gap:3mm; }
  .card__items.two{ grid-template-columns:1fr 1fr; gap:3mm 8mm; }

  .it{ break-inside:avoid; }
  .it__top{ display:flex; align-items:baseline; gap:2mm; flex-wrap:wrap; }
  .it__name{ font-family:var(--body); font-weight:900; font-size:11.5pt; color:var(--ink); line-height:1.05; }
  .it__desc{ font-family:var(--body); font-weight:600; font-style:italic; font-size:8.8pt; line-height:1.28;
             color:var(--ink); opacity:.78; margin-top:.6mm; }

  /* badges */
  .b{ font-style:normal; font-size:11pt; line-height:1; }
  .b--d{ color:#e0452c; }              /* diamond ◆ */
  .b--h{ color:#ff2e88; }              /* heart ♥   */
  .card[style*="--ink:#fff"] .b--d,
  .card[style*="--ink: #fff"] .b--d{ color:#ffd23c; }
  .new{
    font-family:var(--body); font-style:normal; font-weight:900; font-size:6.5pt; letter-spacing:.08em;
    background:var(--outline); color:#fff; border-radius:999px; padding:1.5px 6px; text-transform:uppercase;
    position:relative; top:-1px;
  }

  /* counter strip (inline run) */
  .counter{ font-family:var(--body); font-weight:800; font-size:11.5pt; line-height:1.85; color:var(--ink); }
  .counter .dot{ color:var(--ink); opacity:.5; margin:0 3mm; }
  .counter em{ font-weight:700; font-size:8.5pt; opacity:.75; }

  /* sweet feature */
  .feature{ text-align:center; }
  .feature .card__title{ padding:0; }
  .feature__name{ font-family:var(--round); font-weight:700; font-size:17pt; margin-top:2mm; color:var(--ink); }
  .feature__desc{ font-family:var(--body); font-style:italic; font-weight:700; font-size:10.5pt; opacity:.82; margin-top:2mm; color:var(--ink); }

  /* drinks list rows */
  .drink{ display:flex; align-items:baseline; gap:2mm; }
  .drink__name{ font-family:var(--body); font-weight:900; font-size:12pt; color:var(--ink); }
  .drink__lead{ flex:1; border-bottom:2px dotted currentColor; opacity:.4; margin:0 1mm 1.4mm; }

  .closing{
    margin-top:auto; display:flex; align-items:center; gap:6mm;
    border-top:3px dashed var(--outline); padding-top:5mm;
  }
  .closing__txt{ font-family:var(--round); font-weight:600; font-size:11pt; line-height:1.4; }
  .closing__txt b{ font-family:var(--display); font-size:12pt; }

  /* running foot */
  .foot{ margin-top:5mm; font-family:var(--display); font-size:7.5pt; letter-spacing:.05em; color:var(--outline); opacity:.7;
         display:flex; justify-content:space-between; }

  /* ---------------------------------------------------------------- print */
  @page{ size:A4; margin:0; }
  @media print{
    html{ background:#fff; }
    .page{ margin:0; box-shadow:none; page-break-after:always; break-after:page; }
    .page:last-child{ page-break-after:auto; }
    .no-print{ display:none !important; }
  }
  .toolbar{
    position:fixed; top:12px; right:12px; z-index:99; font-family:var(--body); font-weight:800; font-size:11px;
    background:var(--outline); color:#ffd23c; padding:8px 12px; border-radius:999px; box-shadow:3px 3px 0 #ff4f9a;
  }
</style>

<div class="toolbar no-print">print → Cmd/Ctrl + P</div>
<div id="book"></div>

<script>
/* ============================================================================

   ============================================================================ */
const OL = "#241b2e";

    <circle cx="34" cy="58" r="4" fill="#ff8fb3" stroke="none"/>

    <path d="M24 62 q-9 2 -10 12 M76 62 q9 2 10 12" stroke-width="3.5"/>
    <path d="M38 78 v10 M62 78 v10" stroke-width="3.5"/>`, "0 0 100 100"),

function sparkle(x,y,size,color){
  return `<div class="spark" style="left:${x};top:${y};width:${size}mm;height:${size}mm">
    <svg viewBox="0 0 100 100"><path d="M50 4 L58 42 L96 50 L58 58 L50 96 L42 58 L4 50 L42 42 Z"

/* ============================================================================
   CATALOGUE  — edit dishes here. meal → cuisine group → items.
   sym: "diamond" ◆ | "heart" ♥ | null   ·   isNew: true → NEW badge
   ============================================================================ */

        items:[

  },

  dinner: {
    label:"Dinner", kick:"home food & the pasta bar", illo:"pasta",
    bg:"#2fb56b",
    groups:[
      { origin:"Ghar Ka Khaana", tag:"North Indian · the everyday plate", bg:"#2fb56b", ink:"#fff6df", illo:"bowl", wide:true,
        items:[
          {name:"Roti + Sabji", sym:"heart", desc:"Fresh flatbread & whatever sabji the week brings."},
          {name:"Dal Chawal", sym:"heart", desc:"Comfort in a bowl. Tempered dal over rice."},
          {name:"Kadhi Chawal", sym:"heart", desc:"Silky yogurt & gram-flour curry with rice."},

const COUNTER = {
  origin:"The Condiment Counter", tag:"made in-house · ask for a spoon", bg:"#a97bf0", ink:"#1c0f3a", illo:"chilli",
  items:[
    {name:"Hummus", sym:"heart"}, {name:"Pudina Chutney"}, {name:"Thecha Butter"},
    {name:"Hot Honey Butter"}, {name:"Roasted Red Pepper Sauce"},
    {name:"The 8 Protein Sauces", note:"yogurt-based"}, {name:"House Ginger-Garlic Paste"},
  ]
};

const SWEET = {
  origin:"Sweet Ending", tag:"one, done well", bg:"#ff5da2", ink:"#fff6df", illo:"mascot",
  name:"4-Ingredient Chocolate Pudding", isNew:true,
  desc:"No-bake, set cold. Four things and nothing else."
};

/* ============================================================================
   RENDER
   ============================================================================ */
const SYM = { diamond:"◆", heart:"♥" };
const isLight = ink => /^#f/i.test(ink);   // cream inks start with #f...

function itemHTML(d){
  const sym = d.sym ? `<i class="b b--${d.sym==='diamond'?'d':'h'}">${SYM[d.sym]}</i>` : "";
  const nw  = d.isNew ? `<span class="new">new</span>` : "";
  return `<div class="it">
    <div class="it__top"><span class="it__name">${d.name}</span>${sym}${nw}</div>
    ${d.desc ? `<div class="it__desc">${d.desc}</div>` : ""}
  </div>`;
}

function cardHTML(g){
  const two = (g.wide && g.items.length > 4) ? " two" : "";
  return `<div class="card ${g.wide?'card--wide':''}" style="--bg:${g.bg};--ink:${g.ink}">
    <div class="card__illo">${ILLO[g.illo]||""}</div>
    <div class="card__title">${g.origin}</div>
    <div class="card__tag">${g.tag}</div>
    <div class="card__items${two}">${g.items.map(itemHTML).join("")}</div>
  </div>`;
}

function bannerHTML(meal){
  return `<div class="banner" style="background:${meal.bg}">
    <div>
      <div class="banner__title">${meal.label.toUpperCase()}</div>
      <div class="banner__kick">${meal.kick}</div>
    </div>
    <div class="banner__illo">${ILLO[meal.illo]}</div>
  </div>`;
}

function counterHTML(){
  const run = COUNTER.items.map(c=>{
    const sym = c.sym ? `<i class="b b--h">♥</i>` : "";
    const note = c.note ? ` <em>(${c.note})</em>` : "";
    return `${c.name}${sym}${note}`;
  }).join('<span class="dot">✦</span>');
  return `<div class="card card--wide" style="--bg:${COUNTER.bg};--ink:${COUNTER.ink}">
    <div class="card__illo">${ILLO[COUNTER.illo]}</div>
    <div class="card__title">${COUNTER.origin}</div>
    <div class="card__tag">${COUNTER.tag}</div>
    <div class="counter">${run}</div>
  </div>`;
}

function sweetHTML(){
  return `<div class="card feature" style="--bg:${SWEET.bg};--ink:${SWEET.ink}">
    <div class="card__illo">${ILLO[SWEET.illo]}</div>
    <div class="card__title">${SWEET.origin}</div>
    <div class="feature__name">${SWEET.name} <span class="new">new</span></div>
    <div class="feature__desc">${SWEET.desc}</div>
  </div>`;
}

function drinkCardHTML(g){
  const rows = g.items.map(d=>`<div class="drink"><span class="drink__name">${d.name}</span><span class="drink__lead"></span></div>`).join("");
  return `<div class="card" style="--bg:${g.bg};--ink:${g.ink}">
    <div class="card__illo">${ILLO[g.illo]||""}</div>
    <div class="card__title">${g.origin}</div>
    <div class="card__tag">${g.tag}</div>
    <div class="card__items" style="gap:2mm">${rows}</div>
  </div>`;
}

function foot(pg){ return `<div class="foot"><span>THE DAILY · PRANJAL'S KITCHEN</span><span>${pg}</span></div>`; }

function page(inner, cls="", sparks=""){
  return `<div class="page ${cls}">${sparks}<div class="page__in">${inner}</div></div>`;
}

/* ---- COVER ---- */
const cover = page(`
  <div class="cover__frame">
    ${sparkle("6mm","8mm",9,"#ffd23c")}
    ${sparkle("120mm","4mm",7,"#59b7f5")}
    ${sparkle("150mm","70mm",11,"#2fb56b")}
    <div class="cover__ribbon">✦ Pranjal's Kitchen · Est. Daily</div>
    <div class="cover__logo"><span class="l1">THE</span><span class="l2">DAILY</span></div>
    <div class="cover__tag">A café-style menu of everything I cook — weekly staples, house specials &amp; every reel I couldn't stop thinking about.</div>
    <div class="cover__ritual">☀ <b>The Regular:</b> most mornings begin with Greek yogurt, muesli &amp; an apple. Everything else is served all day.</div>
    <div class="cover__spacer"></div>
    <div class="legend">
      <span class="chip"><span class="s b--d">◆</span> House special · solo</span>
      <span class="chip"><span class="s b--h">♥</span> For two · shared</span>
      <span class="chip"><span class="new">new</span> Saved, not yet in rotation</span>
    </div>
    <div class="cover__foot"><span>VEG · AIR-FRYER · HINGLISH</span><span>A4 · v2</span></div>
  </div>
`, "cover");

/* ---- LUNCH ① ---- */
const L = CATALOGUE.lunch;
const lunch1 = page(
  bannerHTML(L) +
  `<div class="cards">${L.groups.map(cardHTML).join("")}</div>` +
  foot("Lunch · 1 of 2"),
  "", sparkle("176mm","150mm",8,"#ff6fae")+sparkle("6mm","240mm",7,"#34c7b5")
);

/* ---- LUNCH ② ---- */
const lunch2 = page(
  `<div class="banner" style="background:${L.bg}">
     <div><div class="banner__title" style="font-size:26pt">LUNCH, cont.</div>
     <div class="banner__kick">between breads &amp; big bowls</div></div>
     <div class="banner__illo">${ILLO.bowl}</div></div>` +
  `<div class="cards">${L.groups2.map(cardHTML).join("")}${counterHTML()}</div>` +
  foot("Lunch · 2 of 2"),
  "", sparkle("172mm","120mm",9,"#ffd23c")
);

/* ---- DINNER ---- */
const D = CATALOGUE.dinner;
const dinner = page(
  bannerHTML(D) +
  `<div class="cards">${cardHTML(D.groups[0])}${cardHTML(D.groups[1])}${sweetHTML()}</div>` +
  foot("Dinner"),
  "", sparkle("178mm","60mm",8,"#f0503c")+sparkle("8mm","250mm",7,"#ffd23c")
);

/* ---- DRINKS ---- */
const DR = CATALOGUE.drinks;
const drinks = page(
  bannerHTML(DR) +
  `<div class="cards">${DR.groups.map(drinkCardHTML).join("")}</div>` +
  `<div class="closing">
     <div style="width:30mm;flex:none">${ILLO.mascot}</div>
     <div class="closing__txt"><b>That's the menu!</b><br>Cocktails are a starting list — only rule is gin, whiskey or vodka. Tell the kitchen what you're feeling.</div>
   </div>` +
  foot("Drinks"),
  "", sparkle("174mm","150mm",9,"#7c83ff")+sparkle("10mm","30mm",7,"#2ec4b6")
);

document.getElementById("book").innerHTML = cover + lunch1 + lunch2 + dinner + drinks;
</script>

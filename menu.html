<!--
  THE DAILY — My Menu  ·  berry-much / watercolour-market edition (v3)
  A print-ready, café-style menu of everything Pranjal cooks.

  PRINT :  open in Chrome → Cmd/Ctrl+P → Save as PDF. A4 · background graphics ON.

  FONTS :  headings use "Pansy", sub-headings use "Tulip".
           Drop the real font files into ./fonts/ (see fonts/README.md) and they
           activate automatically. Until then, Baloo 2 / Fredoka stand in.

  EDIT  :  every dish lives in the CATALOGUE object in the <script> below.
           Each cuisine group carries its own card colour (`pastel`), heading
           colour (`hue`) and illustration key (`illo`). Change data, not layout.

  Symbols:  ◆ house special (solo)   ♥ for two (shared)   NEW = saved, not yet in rotation
-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>THE DAILY — My Menu</title>

<style>
  /* real display fonts (drop-in) ------------------------------------------- */
  @font-face{ font-family:"Pansy"; src:url("fonts/Pansy.woff2") format("woff2"), url("fonts/Pansy.ttf") format("truetype"); font-display:swap; }
  @font-face{ font-family:"Tulip"; src:url("fonts/Tulip.woff2") format("woff2"), url("fonts/Tulip.ttf") format("truetype"); font-display:swap; }
  /* fallbacks + body ------------------------------------------------------- */
  @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Fredoka:wght@400;500;600;700&family=Nunito:ital,wght@0,600;0,700;0,800;0,900;1,600;1,700&display=swap');

  :root{
    /* berry-much pastels */
    --butter:#fef7c5; --pink:#ffb4da; --mint:#d5ffc9; --cream:#fff8e9;
    --lilac:#f5d1ef; --sky:#bcd3f9; --blush:#fff4fd; --peach:#ffcbbf;

    --paper:#fff8e9;            /* page background */
    --ink:#3b2f36;             /* warm near-black body text */
    --ink-soft:#7a6b72;

    --head:"Pansy","Baloo 2",system-ui,sans-serif;    /* headings     */
    --sub:"Tulip","Fredoka",system-ui,sans-serif;     /* sub-headings */
    --body:"Nunito",system-ui,sans-serif;             /* body         */

    --gingham:#8fb3ec;         /* blue check motif */

    --page-w:210mm; --page-h:297mm; --pad:13mm;
  }
  *{ box-sizing:border-box; }
  html{ background:#e7d9c4; }
  body{ margin:0; font-family:var(--body); color:var(--ink); -webkit-font-smoothing:antialiased; }

  /* ---------------------------------------------------------------- page */
  .page{
    position:relative; width:var(--page-w); height:var(--page-h);
    margin:9mm auto; padding:var(--pad); overflow:hidden;
    background:var(--paper);
    background-image:radial-gradient(#efe4cf 1px, transparent 1.3px);
    background-size:15px 15px;
    box-shadow:0 8px 34px rgba(0,0,0,.22);
  }
  .page__in{ position:relative; height:100%; z-index:2; display:flex; flex-direction:column; }
  .spark{ position:absolute; z-index:1; pointer-events:none; }

  /* blue gingham motif */
  .gingham{
    background-color:transparent;
    background-image:
      linear-gradient(45deg, var(--gingham) 25%, transparent 25% 75%, var(--gingham) 75%),
      linear-gradient(45deg, var(--gingham) 25%, transparent 25% 75%, var(--gingham) 75%);
    background-size:14px 14px; background-position:0 0, 7px 7px;
    opacity:.9;
  }

  /* ---------------------------------------------------------------- cover */
  .cover{ background:var(--pink); background-image:radial-gradient(rgba(255,255,255,.5) 1.3px, transparent 1.4px); background-size:16px 16px; }
  .cover__frame{
    flex:1; border:3px solid #fff; border-radius:30px; background:var(--cream);
    box-shadow:0 10px 0 rgba(255,138,180,.45), 0 12px 30px rgba(0,0,0,.12);
    padding:11mm 11mm 17mm; display:flex; flex-direction:column; position:relative; overflow:hidden;
  }
  .cover__check{ position:absolute; inset:auto 0 0 0; height:9mm; }
  .cover__ribbon{
    align-self:flex-start; font-family:var(--sub); font-weight:600; font-size:12pt;
    background:var(--sky); color:#2f4a86; border-radius:999px; padding:4px 18px;
    box-shadow:0 3px 0 rgba(120,150,210,.5);
  }
  .cover__logo{ font-family:var(--head); line-height:.9; font-size:86pt; margin:9mm 0 0; letter-spacing:.01em; }
  .cover__logo span{ display:inline-block; }
  .cover__logo .r2{ display:block; }
  .cover__tag{ font-family:var(--sub); font-weight:500; font-size:16pt; color:var(--ink); margin-top:7mm; max-width:140mm; line-height:1.4; }
  .cover__ritual{
    margin-top:6mm; align-self:flex-start; max-width:125mm;
    background:var(--mint); border-radius:18px; padding:5mm 6mm;
    font-family:var(--body); font-weight:700; font-size:11pt; color:#38602c;
    box-shadow:0 4px 0 rgba(150,200,140,.5);
  }
  .cover__ritual b{ font-family:var(--sub); font-weight:600; }
  .cover__spacer{ flex:1; }
  .legend{ display:flex; flex-wrap:wrap; gap:5mm; }
  .legend .chip{
    display:inline-flex; align-items:center; gap:7px; background:#fff; color:var(--ink);
    border-radius:999px; padding:5px 15px; font-family:var(--body); font-weight:800; font-size:9.5pt;
    box-shadow:0 3px 0 rgba(0,0,0,.06);
  }
  .legend .chip .s{ font-size:12pt; line-height:1; }
  .cover__foot{ margin-top:6mm; display:flex; justify-content:space-between; align-items:center;
    font-family:var(--sub); font-weight:600; font-size:10pt; color:var(--ink-soft); }

  /* ------------------------------------------------------------- banners */
  .banner{
    display:flex; align-items:center; gap:6mm; border-radius:24px; padding:5mm 8mm; margin-bottom:7mm;
    position:relative; box-shadow:0 5px 0 rgba(0,0,0,.06); overflow:hidden;
  }
  .banner__check{ position:absolute; inset:0 0 0 auto; width:34mm; opacity:.5; }
  .banner__title{ font-family:var(--head); font-size:38pt; line-height:.9; position:relative; }
  .banner__kick{ font-family:var(--sub); font-weight:500; font-size:12pt; color:var(--ink); opacity:.8; margin-top:1mm; }
  .banner__illo{ margin-left:auto; position:relative; width:26mm; height:26mm; }

  /* --------------------------------------------------------------- cards */
  .cards{ display:grid; grid-template-columns:1fr 1fr; gap:7mm; align-content:start; }
  .card{
    --pastel:#fff; --hue:#3b2f36;
    background:var(--pastel); border:2.5px solid var(--hue); border-radius:22px;
    box-shadow:0 5px 0 color-mix(in srgb, var(--hue) 28%, transparent);
    padding:6mm; position:relative; overflow:hidden; break-inside:avoid;
  }
  .card--wide{ grid-column:1 / -1; }
  .card__illo{ position:absolute; top:2mm; right:2mm; width:22mm; height:22mm; }

  /* illustration slot: PNG (assets/…) on top, vector fallback behind */
  .illo{ position:relative; display:block; width:100%; height:100%; }
  .illo-img{ position:absolute; inset:0; width:100%; height:100%; object-fit:contain; }
  .illo-svg, .illo-svg svg{ display:block; width:100%; height:100%; }
  .scatter{ position:absolute; z-index:1; pointer-events:none; }
  .scatter .illo-svg svg{ filter:none; }   /* keep tiny scatter crisp */
  .card__title{ font-family:var(--sub); font-weight:600; font-size:20pt; line-height:1; color:var(--hue); padding-right:20mm; }
  .card__tag{ font-family:var(--body); font-weight:800; font-size:8pt; letter-spacing:.12em; text-transform:uppercase;
    color:var(--hue); opacity:.7; margin:2mm 0 4mm; }
  .card__items{ display:grid; grid-template-columns:1fr; gap:3mm; }
  .card__items.two{ grid-template-columns:1fr 1fr; gap:3mm 8mm; }

  .it{ break-inside:avoid; }
  .it__top{ display:flex; align-items:baseline; gap:2mm; flex-wrap:wrap; }
  .it__name{ font-family:var(--body); font-weight:900; font-size:11.5pt; color:var(--ink); line-height:1.05; }
  .it__desc{ font-family:var(--body); font-weight:600; font-style:italic; font-size:8.8pt; line-height:1.28; color:var(--ink); opacity:.72; margin-top:.5mm; }

  .b{ font-style:normal; font-size:11pt; line-height:1; }
  .b--d{ color:#d64b32; }   /* ◆ tomato */
  .b--h{ color:#d6417b; }   /* ♥ raspberry */
  .new{ font-family:var(--body); font-weight:900; font-size:6.5pt; letter-spacing:.08em; text-transform:uppercase;
    background:var(--hue); color:#fff; border-radius:999px; padding:1.5px 6px; position:relative; top:-1px; }

  .counter{ font-family:var(--body); font-weight:800; font-size:11.5pt; line-height:1.85; color:var(--ink); }
  .counter .dot{ color:var(--hue); margin:0 2.5mm; }
  .counter em{ font-weight:700; font-size:8.5pt; opacity:.7; }

  .feature{ text-align:center; }
  .feature .card__title{ padding:0; }
  .feature__name{ font-family:var(--sub); font-weight:600; font-size:17pt; margin-top:2mm; color:var(--ink); }
  .feature__desc{ font-family:var(--body); font-style:italic; font-weight:700; font-size:10.5pt; opacity:.78; margin-top:2mm; }

  .drink{ display:flex; align-items:baseline; gap:2mm; }
  .drink__name{ font-family:var(--body); font-weight:900; font-size:12pt; color:var(--ink); }
  .drink__lead{ flex:1; border-bottom:2px dotted var(--hue); opacity:.45; margin:0 1mm 1.4mm; }

  .closing{ margin-top:auto; display:flex; align-items:center; gap:6mm; border-top:2.5px dashed #e6b7cf; padding-top:5mm; }
  .closing__txt{ font-family:var(--sub); font-weight:500; font-size:11.5pt; line-height:1.4; }
  .closing__txt b{ font-family:var(--head); font-size:13pt; color:#d6417b; }

  .foot{ margin-top:5mm; font-family:var(--sub); font-weight:600; font-size:8.5pt; color:var(--ink-soft);
    display:flex; justify-content:space-between; }

  /* ---------------------------------------------------------------- print */
  @page{ size:A4; margin:0; }
  @media print{
    html{ background:#fff; }
    .page{ margin:0; box-shadow:none; page-break-after:always; break-after:page; }
    .page:last-child{ page-break-after:auto; }
    .no-print{ display:none !important; }
  }
  .toolbar{ position:fixed; top:12px; right:12px; z-index:99; font-family:var(--body); font-weight:800; font-size:11px;
    background:#fff; color:#d6417b; padding:8px 12px; border-radius:999px; box-shadow:0 3px 0 rgba(214,65,123,.35); }
</style>

<div class="toolbar no-print">print → Cmd/Ctrl + P</div>

<!-- watercolour edge filter (softens the vector fallbacks) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <filter id="wc" x="-8%" y="-8%" width="116%" height="116%">
    <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="2.6" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</defs></svg>

<div id="book"></div>

<script>

function sparkle(x,y,size,color){
  return `<div class="spark" style="left:${x};top:${y};width:${size}mm;height:${size}mm">
    <svg viewBox="0 0 100 100"><path d="M50 6 C54 34 66 46 94 50 C66 54 54 66 50 94 C46 66 34 54 6 50 C34 46 46 34 50 6Z" fill="${color}"/></svg></div>`;
}
/* illustration slot: PNG from assets/<key>.png on top, vector fallback behind.
   Missing PNG → onerror removes the img and the vector shows. */
function illo(key){
  return `<span class="illo"><img class="illo-img" src="assets/${key}.png" alt=""
    onload="this.nextElementSibling.style.display='none'" onerror="this.remove()"><span class="illo-svg">${ILLO[key]||""}</span></span>`;
}
/* a scattered decorative fruit at an absolute position */
function scatterFruit(key,x,y,size,rot=0){
  return `<div class="scatter" style="left:${x};top:${y};width:${size}mm;height:${size}mm;transform:rotate(${rot}deg)"><span class="illo-svg">${ILLO[key]||""}</span></div>`;
}

/* ============================================================================
   CATALOGUE — meal → cuisine group → items.  pastel = card bg, hue = heading.
   ============================================================================ */
const CATALOGUE = {
  lunch:{ label:"Lunch", kick:"midday, lighter & all-day breakfast", illo:"strawberry",
    banner:{pastel:"#ffb4da", hue:"#c43a78"},
    groups:[
      { origin:"South Indian", tag:"tiffin & staples", pastel:"#fef7c5", hue:"#d9772a", illo:"lemon",
        items:[
          {name:"Poha", desc:"Flattened rice, mustard-seed tadka, peanuts & lime."},

/* ============================================================================ RENDER */
const SYM={diamond:"◆",heart:"♥"};
function itemHTML(d){
  const sym=d.sym?`<i class="b b--${d.sym==='diamond'?'d':'h'}">${SYM[d.sym]}</i>`:"";
  const nw=d.isNew?`<span class="new">new</span>`:"";
  return `<div class="it"><div class="it__top"><span class="it__name">${d.name}</span>${sym}${nw}</div>${d.desc?`<div class="it__desc">${d.desc}</div>`:""}</div>`;
}
function cardHTML(g){
  const two=(g.wide&&g.items.length>4)?" two":"";
  return `<div class="card ${g.wide?'card--wide':''}" style="--pastel:${g.pastel};--hue:${g.hue}">
    <div class="card__illo">${illo(g.illo)}</div>
    <div class="card__title">${g.origin}</div><div class="card__tag">${g.tag}</div>
    <div class="card__items${two}">${g.items.map(itemHTML).join("")}</div></div>`;
}
function bannerHTML(meal){
  return `<div class="banner" style="background:${meal.banner.pastel}">
    <div class="gingham banner__check"></div>
    <div><div class="banner__title" style="color:${meal.banner.hue}">${meal.label.toUpperCase()}</div>
    <div class="banner__kick">${meal.kick}</div></div>
    <div class="banner__illo">${illo(meal.illo)}</div></div>`;
}
function counterHTML(){
  const run=COUNTER.items.map(c=>{const sym=c.sym?`<i class="b b--h">♥</i>`:"";const note=c.note?` <em>(${c.note})</em>`:"";return `${c.name}${sym}${note}`;}).join('<span class="dot">✿</span>');
  return `<div class="card card--wide" style="--pastel:${COUNTER.pastel};--hue:${COUNTER.hue}">
    <div class="card__illo">${illo(COUNTER.illo)}</div><div class="card__title">${COUNTER.origin}</div>
    <div class="card__tag">${COUNTER.tag}</div><div class="counter">${run}</div></div>`;
}
function sweetHTML(){
  return `<div class="card feature" style="--pastel:${SWEET.pastel};--hue:${SWEET.hue}">
    <div class="card__illo">${illo(SWEET.illo)}</div><div class="card__title">${SWEET.origin}</div>
    <div class="feature__name">${SWEET.name} <span class="new">new</span></div><div class="feature__desc">${SWEET.desc}</div></div>`;
}
function drinkCardHTML(g){
  const rows=g.items.map(d=>`<div class="drink"><span class="drink__name">${d.name}</span><span class="drink__lead"></span></div>`).join("");
  return `<div class="card" style="--pastel:${g.pastel};--hue:${g.hue}">
    <div class="card__illo">${illo(g.illo)}</div><div class="card__title">${g.origin}</div>
    <div class="card__tag">${g.tag}</div><div class="card__items" style="gap:2mm">${rows}</div></div>`;
}
function foot(pg){ return `<div class="foot"><span>THE DAILY · PRANJAL'S KITCHEN</span><span>${pg}</span></div>`; }
function page(inner,cls="",sparks=""){ return `<div class="page ${cls}">${sparks}<div class="page__in">${inner}</div></div>`; }

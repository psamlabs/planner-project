<!--
  THE DAILY — My Menu
  A print-ready, café-style menu of everything Pranjal cooks.

  HOW TO PRINT
  ------------
  Open this file in Chrome → Cmd/Ctrl+P → "Save as PDF".
  Paper: A4 · Margins: Default (the layout supplies its own) · Background graphics: ON.

  HOW TO EDIT
  -----------
  All dishes live in the MENU array in the <script> at the bottom of this file.
  Change names, descriptions, symbols or sections there — the layout redraws
  itself. Nothing about the design needs touching to add or remove a dish.

  Symbols:  ◆ house special (solo)   ♥ for two (shared)   (new) saved, not yet in rotation
-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>THE DAILY — My Menu</title>

<style>
  /* =========================================================================
     THE DAILY — draft skin: zine / risograph starting point
     2 inks (ember red + ink blue) on warm paper, hand-set type feel.
     Swap the --ink / --paper vars + fonts when the reference lands.
     ========================================================================= */

  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Space+Mono:wght@400;700&display=swap');

  :root {
    --paper:      #f3ead6;   /* warm off-white stock */
    --paper-deep: #ece0c6;
    --ink:        #1f2a44;   /* ink blue — primary */
    --ember:      #e0452c;   /* riso ember red — accent */
    --ember-soft: #f0a58f;
    --faded:      #6d6a5f;

    --serif: "Fraunces", "Hoefler Text", Georgia, serif;
    --mono:  "Space Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;

    --page-w: 210mm;
    --page-h: 297mm;
    --pad:    16mm;
  }

  * { box-sizing: border-box; }

  html { background: #b9ad91; }

  body {
    margin: 0;
    font-family: var(--serif);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  /* ---- The page (one A4 leaf of the booklet) ---------------------------- */
  .page {
    position: relative;
    width: var(--page-w);
    min-height: var(--page-h);
    margin: 10mm auto;
    padding: var(--pad);
    background-color: var(--paper);
    /* paper grain: fine speckle so screen ≈ print */
    background-image:
      radial-gradient(circle at 50% 50%, rgba(31,42,68,.035) 0.5px, transparent 0.6px),
      radial-gradient(circle at 50% 50%, rgba(224,69,44,.028) 0.5px, transparent 0.6px);
    background-size: 3px 3px, 4px 4px;
    background-position: 0 0, 1px 2px;
    box-shadow: 0 6px 30px rgba(0,0,0,.28);
    overflow: hidden;
  }

  /* hairline registration frame — a zine tell */
  .page::before {
    content: "";
    position: absolute;
    inset: 8mm;
    border: 1px solid rgba(31,42,68,.35);
    pointer-events: none;
  }

  .page__inner { position: relative; z-index: 1; }

  /* corner crop marks */
  .crop { position: absolute; width: 6mm; height: 6mm; z-index: 2; }
  .crop::before, .crop::after { content:""; position:absolute; background: var(--ember); }
  .crop::before { width:100%; height:1px; top:0; }
  .crop::after  { width:1px; height:100%; left:0; }
  .crop.tl { top: 4mm; left: 4mm; }
  .crop.tr { top: 4mm; right: 4mm; transform: scaleX(-1); }
  .crop.bl { bottom: 4mm; left: 4mm; transform: scaleY(-1); }
  .crop.br { bottom: 4mm; right: 4mm; transform: scale(-1); }

  /* =========================== COVER ==================================== */
  .cover .page__inner {
    height: calc(var(--page-h) - 2*var(--pad));
    display: flex;
    flex-direction: column;
  }
  .cover__top {
    font-family: var(--mono);
    font-size: 9.5pt;
    letter-spacing: .28em;
    text-transform: uppercase;
    display: flex;
    justify-content: space-between;
    color: var(--faded);
  }
  .cover__mid { margin-top: auto; margin-bottom: auto; }
  .cover__kicker {
    font-family: var(--mono);
    font-size: 10pt;
    letter-spacing: .35em;
    text-transform: uppercase;
    color: var(--ember);
    margin-bottom: 6mm;
  }
  .cover__title {
    font-family: var(--serif);
    font-weight: 600;
    font-size: 108pt;
    line-height: .86;
    letter-spacing: -.02em;
    margin: 0;
  }
  .cover__title .amp { color: var(--ember); font-style: italic; font-weight: 400; }
  .cover__sub {
    margin-top: 8mm;
    max-width: 120mm;
    font-size: 13pt;
    line-height: 1.5;
    font-style: italic;
    color: var(--ink);
  }
  .cover__rule {
    height: 3px;
    background: var(--ink);
    margin: 9mm 0;
    position: relative;
  }
  .cover__rule::after {
    content:""; position:absolute; left:0; top:6px; width: 46mm; height:3px; background: var(--ember);
  }
  .cover__profile {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 6mm 10mm;
    font-family: var(--mono);
    font-size: 8.5pt;
    line-height: 1.55;
    color: var(--ink);
  }
  .cover__profile b { color: var(--ember); letter-spacing: .08em; text-transform: uppercase; display:block; margin-bottom:1.5mm; }
  .cover__foot {
    margin-top: 8mm;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    font-family: var(--mono);
    font-size: 8pt;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: var(--faded);
  }

  /* legend chips */
  .legend { display: flex; gap: 7mm; flex-wrap: wrap; font-family: var(--mono); font-size: 8.5pt; }
  .legend span { display:inline-flex; align-items:center; gap:2mm; }
  .sym { color: var(--ember); font-size: 11pt; line-height: 1; }
  .sym-new { font-style: italic; color: var(--ember); font-family: var(--serif); }

  /* =========================== CONTENT ================================== */
  .masthead {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    border-bottom: 3px solid var(--ink);
    padding-bottom: 3mm;
    margin-bottom: 7mm;
  }
  .masthead__name { font-family: var(--mono); font-weight: 700; letter-spacing:.3em; font-size: 10pt; text-transform: uppercase; }
  .masthead__pg   { font-family: var(--mono); font-size: 9pt; color: var(--faded); letter-spacing:.2em; }

  .section { margin-bottom: 9mm; break-inside: avoid; }
  .section:last-child { margin-bottom: 0; }

  .section__head {
    display: flex;
    align-items: baseline;
    gap: 4mm;
    margin-bottom: 4mm;
  }
  .section__no {
    font-family: var(--mono);
    font-size: 9pt;
    color: var(--ember);
    letter-spacing: .1em;
  }
  .section__title {
    font-family: var(--serif);
    font-weight: 600;
    font-size: 22pt;
    letter-spacing: -.01em;
    margin: 0;
    line-height: 1;
  }
  .section__dots { flex: 1; border-bottom: 1.5px dotted var(--ink); align-self: center; margin: 0 1mm; opacity:.5; }
  .section__tag {
    font-family: var(--mono);
    font-size: 7.5pt;
    text-transform: uppercase;
    letter-spacing: .16em;
    color: var(--faded);
    white-space: nowrap;
  }

  /* dish list — two column on roomy sections */
  .dishes { display: grid; grid-template-columns: 1fr; gap: 3.5mm 12mm; }
  .dishes.cols-2 { grid-template-columns: 1fr 1fr; }

  .dish { break-inside: avoid; }
  .dish__line {
    display: flex;
    align-items: baseline;
    gap: 2mm;
  }
  .dish__name {
    font-family: var(--serif);
    font-weight: 600;
    font-size: 12pt;
    white-space: nowrap;
  }
  .dish__sym { color: var(--ember); font-size: 11pt; }
  .dish__new { font-family: var(--serif); font-style: italic; font-weight: 400; font-size: 9pt; color: var(--ember); }
  .dish__lead { flex: 1; border-bottom: 1px dotted rgba(31,42,68,.4); margin: 0 1.5mm 1.2mm; }
  .dish__desc {
    font-family: var(--serif);
    font-size: 9.5pt;
    line-height: 1.35;
    color: var(--faded);
    margin-top: .5mm;
    font-style: italic;
  }

  /* condiment counter — inline run */
  .counter {
    font-family: var(--serif);
    font-size: 12pt;
    line-height: 1.9;
  }
  .counter b { font-weight: 600; }
  .counter .dot { color: var(--ember); margin: 0 2.5mm; }
  .counter .note { display:block; margin-top:3mm; font-size:9.5pt; font-style:italic; color:var(--faded); }

  /* bar list */
  .bar { display: grid; grid-template-columns: 1fr 1fr; gap: 6mm 12mm; }
  .bar__group b {
    display:block; font-family: var(--mono); font-size: 8pt; text-transform: uppercase;
    letter-spacing:.18em; color: var(--ember); margin-bottom: 2.5mm; border-bottom:1px solid var(--ember-soft); padding-bottom:1.5mm;
  }
  .bar__group ul { list-style:none; margin:0; padding:0; }
  .bar__group li { font-size: 12pt; margin-bottom: 1.5mm; }
  .bar__group li span { color: var(--faded); font-size: 9pt; font-style: italic; }

  /* sweet ending feature block */
  .feature {
    border: 2px solid var(--ink);
    padding: 7mm;
    text-align: center;
    background:
      repeating-linear-gradient(45deg, rgba(224,69,44,.05) 0 6px, transparent 6px 12px);
  }
  .feature__name { font-family: var(--serif); font-weight:700; font-size: 20pt; }
  .feature__desc { font-style: italic; color: var(--faded); margin-top: 3mm; font-size: 11pt; }

  .colophon {
    margin-top: 8mm;
    border-top: 1px solid rgba(31,42,68,.3);
    padding-top: 4mm;
    font-family: var(--mono);
    font-size: 7.5pt;
    letter-spacing: .12em;
    color: var(--faded);
    line-height: 1.7;
    text-transform: uppercase;
  }

  /* =========================== PRINT ==================================== */
  @page { size: A4; margin: 0; }

  @media print {
    html { background: #fff; }
    .page {
      margin: 0;
      box-shadow: none;
      width: var(--page-w);
      height: var(--page-h);
      page-break-after: always;
      break-after: page;
    }
    .page:last-child { page-break-after: auto; }
    .no-print { display: none !important; }
  }

  /* screen-only helper bar */
  .toolbar {
    position: fixed; top: 12px; right: 12px; z-index: 99;
    font-family: var(--mono); font-size: 11px;
    background: var(--ink); color: var(--paper);
    padding: 8px 12px; border-radius: 2px;
    box-shadow: 0 4px 14px rgba(0,0,0,.3);
  }
  .toolbar b { color: var(--ember-soft); }
</style>

<div class="toolbar no-print">DRAFT · print to PDF → <b>Cmd/Ctrl + P</b></div>

<div id="book"></div>

<script>
/* ===========================================================================
   MENU DATA  —  edit here, the layout redraws itself.
   symbol: "diamond" (◆ house special) | "heart" (♥ for two) | null
   isNew:  true  → prints the italic (new) marker
   =========================================================================== */

const PROFILE = {
  diet:      "Vegetarian · paneer, dairy, tofu & plant proteins. No eggs, no meat.",
  kitchen:   "Stovetop + air fryer. No oven — everything adapted to the tools on hand.",
  breakfast: "Most mornings begin with The Regular: Greek yogurt, muesli & an apple.",
  cook:      "Cooked for one, sometimes two. Symbols tell you which is which."
};

const MENU = [
  {
    title: "All-Day Breakfast",
    tag: "served whenever you like",
    cols: 2,
    items: [
      { name: "The Regular",  desc: "Greek yogurt, muesli & a crisp apple. The morning ritual." },
      { name: "Poha",         desc: "Flattened rice, mustard-seed tadka, peanuts & lime." },
      { name: "Dosa",         sym: "diamond", desc: "Crisp fermented crepe straight off the tawa." },
      { name: "Uttapam",      sym: "diamond", desc: "Thick, fluffy pancake loaded with onion & tomato." },
      { name: "Shakshuka",    desc: "Spiced tomato-pepper stew, scoop-with-bread. Veg edition." },
      { name: "Avocado Toast",sym: "diamond", desc: "Smashed avocado, chilli flakes, good crunch." },
      { name: "Lentil Chilla",isNew: true, desc: "Savoury moong pancake, quietly protein-packed." },
      { name: "Ragi Roti",    isNew: true, desc: "Nutty finger-millet flatbread, tawa-fresh." },
      { name: "Paneer Cucumber Bowl", isNew: true, desc: "Cottage cheese, cucumber & herbs. Cool and light." },
      { name: "Tahini Chickpea Toast", isNew: true, desc: "Creamy tahini, mashed chickpea, a squeeze of lemon." },
      { name: "Protein Smoothie Bowl", isNew: true, desc: "Blended thick & spooned. About 35g protein." }
    ]
  },
  {
    title: "Ghar Ka Khaana",
    tag: "home food, the everyday plate",
    cols: 2,
    items: [
      { name: "Roti + Sabji", sym: "heart",   desc: "Fresh flatbread & whatever sabji the week brings." },
      { name: "Dal Chawal",   sym: "heart",   desc: "Comfort in a bowl. Tempered dal over rice." },
      { name: "Kadhi Chawal", sym: "heart",   desc: "Silky yogurt & gram-flour curry with rice." },
      { name: "Dal Bati",     sym: "diamond", desc: "Batis crisped in the air fryer, served with dal." },
      { name: "Pav Bhaji",    sym: "diamond", desc: "Buttery mashed-veg curry with soft pav." },
      { name: "Paneer Bhurji",sym: "diamond", desc: "Scrambled paneer, onions & masala." },
      { name: "Tofu Rajma Curry", isNew: true, desc: "Kidney beans & tofu in a thick, slow gravy." },
      { name: "Dal, Toasted Jeera Tadka", isNew: true, desc: "Extra-nutty cumin tempering poured over." }
    ]
  },
  {
    title: "Pasta Bar",
    tag: "stovetop only · no oven needed",
    cols: 2,
    items: [
      { name: "Pesto Pasta",     sym: "diamond", desc: "Basil-forward, sharp & green." },
      { name: "Cream Pasta",     sym: "diamond", desc: "White sauce, garlic, all comfort." },
      { name: "Red Sauce Pasta", sym: "diamond", desc: "Slow tomato sauce with herbs." },
      { name: "Creamy Farfalle", isNew: true, desc: "Bow-ties in a velvety sauce." },
      { name: "Stuffed Pesto Shells", isNew: true, desc: "Cooked in the skillet, never baked." }
    ]
  },
  {
    title: "Between Breads",
    tag: "sandwiches, wraps & toasts",
    cols: 2,
    items: [
      { name: "House Sandwich", sym: "diamond", desc: "The signature stack, built your way." },
      { name: "Paneer Shawarma Wrap", isNew: true, desc: "Air-fried crispy paneer, garlic sauce, rolled tight." },
      { name: "Spicy Korean Sandwich", isNew: true, desc: "Paneer edition — sweet heat & crunch." },
      { name: "Bean Patty Sandwich", isNew: true, desc: "House-made bean patty, properly stacked." },
      { name: "Paneer Tikka Garlic Bread", isNew: true, desc: "Tawa-style, smoky paneer on garlic bread." },
      { name: "Bruschetta", isNew: true, desc: "Tawa-toasted under a lid. High-protein topping." }
    ]
  },
  {
    title: "Bowls & Small Plates",
    tag: "high-protein, one-bowl meals",
    cols: 2,
    items: [
      { name: "Thai Tofu Bowl",  isNew: true, desc: "Coconut-lime & tofu. About 30g protein." },
      { name: "Gobhi Steak Bowl",isNew: true, desc: "Seared cauliflower steak. About 27g protein." },
      { name: "Steamed Momos",   isNew: true, desc: "Hand-pleated & steamed, with a fiery dip." },
      { name: "Dahi Vada",       isNew: true, desc: "Steamed never fried. Cool yogurt & chutney." }
    ]
  }
];

const COUNTER = {
  title: "The Condiment Counter",
  tag: "made in-house · ask for a spoon",
  items: [
    { name: "Hummus", sym: "heart" },
    { name: "Pudina Chutney" },
    { name: "Thecha Butter" },
    { name: "Hot Honey Butter" },
    { name: "Roasted Red Pepper Protein Sauce" },
    { name: "The 8 Protein Sauces", note: "yogurt-based" },
    { name: "House Ginger-Garlic Paste" }
  ]
};

const SWEET = {
  title: "Sweet Ending",
  name: "4-Ingredient Chocolate Pudding",
  desc: "No-bake, set cold. Four things and nothing else.",
  isNew: true
};

const BAR = {
  title: "Bar & Brew",
  groups: [
    { label: "Brews",   items: [ ["Coffee",""], ["Matcha",""] ] },
    { label: "Gin",     items: [ ["Gin & Tonic",""], ["Gimlet",""] ] },
    { label: "Whiskey", items: [ ["Whiskey Sour",""], ["Old Fashioned",""] ] },
    { label: "Vodka",   items: [ ["Moscow Mule",""], ["Espresso Martini",""] ] }
  ]
};

/* ===========================================================================
   RENDER
   =========================================================================== */
const SYM = { diamond: "◆", heart: "♥" };

function dishHTML(d) {
  const sym = d.sym ? `<span class="dish__sym">${SYM[d.sym]}</span>` : "";
  const nw  = d.isNew ? ` <span class="dish__new">(new)</span>` : "";
  return `
    <div class="dish">
      <div class="dish__line">
        <span class="dish__name">${d.name}${nw}</span>
        ${sym}
        <span class="dish__lead"></span>
      </div>
      ${d.desc ? `<div class="dish__desc">${d.desc}</div>` : ""}
    </div>`;
}

function sectionHTML(sec, no) {
  const dishes = sec.items.map(dishHTML).join("");
  return `
    <div class="section">
      <div class="section__head">
        <span class="section__no">${String(no).padStart(2,"0")}</span>
        <h2 class="section__title">${sec.title}</h2>
        <span class="section__dots"></span>
        <span class="section__tag">${sec.tag}</span>
      </div>
      <div class="dishes ${sec.cols === 2 ? "cols-2" : ""}">${dishes}</div>
    </div>`;
}

function masthead(pg) {
  return `<div class="masthead">
    <span class="masthead__name">The Daily</span>
    <span class="masthead__pg">Pranjal's Kitchen · ${pg}</span>
  </div>`;
}

function crops() {
  return `<span class="crop tl"></span><span class="crop tr"></span><span class="crop bl"></span><span class="crop br"></span>`;
}

function page(inner, cls="") {
  return `<div class="page ${cls}">${crops()}<div class="page__inner">${inner}</div></div>`;
}

/* ---- Cover ---- */
const cover = page(`
  <div class="cover__top">
    <span>Est. Daily</span>
    <span>Veg · Air-Fryer · Hinglish</span>
  </div>
  <div class="cover__mid">
    <div class="cover__kicker">Pranjal's Kitchen presents</div>
    <h1 class="cover__title">THE<br>DAILY</h1>
    <p class="cover__sub">A café-style menu of everything I cook — the weekly staples, the house specials, and every reel I couldn't stop thinking about.</p>
    <div class="cover__rule"></div>
    <div class="cover__profile">
      <div><b>The Diet</b>${PROFILE.diet}</div>
      <div><b>The Kitchen</b>${PROFILE.kitchen}</div>
      <div><b>The Regular</b>${PROFILE.breakfast}</div>
      <div><b>The Table</b>${PROFILE.cook}</div>
    </div>
  </div>
  <div class="cover__foot">
    <div class="legend">
      <span><span class="sym">◆</span> House special</span>
      <span><span class="sym">♥</span> For two</span>
      <span><span class="sym-new">(new)</span> Saved, not yet in rotation</span>
    </div>
    <span>A4 · v1</span>
  </div>
`, "cover");

/* ---- Content pages ---- */
/* Page 2: Breakfast + Ghar Ka Khaana */
const p2 = page(
  masthead("Breakfast & Home") +
  sectionHTML(MENU[0], 1) +
  sectionHTML(MENU[1], 2)
);

/* Page 3: Pasta + Between Breads */
const p3 = page(
  masthead("Pasta & Breads") +
  sectionHTML(MENU[2], 3) +
  sectionHTML(MENU[3], 4)
);

/* Page 4: Bowls + Condiment Counter */
const counterItems = COUNTER.items.map(c => {
  const sym = c.sym ? `<span class="dish__sym">${SYM[c.sym]}</span>` : "";
  const note = c.note ? ` <span style="font-size:9pt;font-style:italic;color:var(--faded)">(${c.note})</span>` : "";
  return `<b>${c.name}</b>${sym}${note}`;
}).join('<span class="dot">·</span>');

const p4 = page(
  masthead("Bowls & Counter") +
  sectionHTML(MENU[4], 5) +
  `<div class="section">
    <div class="section__head">
      <span class="section__no">06</span>
      <h2 class="section__title">${COUNTER.title}</h2>
      <span class="section__dots"></span>
      <span class="section__tag">${COUNTER.tag}</span>
    </div>
    <div class="counter">${counterItems}</div>
  </div>`
);

/* Page 5: Sweet Ending + Bar & Brew */
const barHTML = BAR.groups.map(g => `
  <div class="bar__group">
    <b>${g.label}</b>
    <ul>${g.items.map(i => `<li>${i[0]}${i[1] ? ` <span>${i[1]}</span>` : ""}</li>`).join("")}</ul>
  </div>`).join("");

const p5 = page(
  masthead("Sweet & Bar") +
  `<div class="section">
    <div class="section__head">
      <span class="section__no">07</span>
      <h2 class="section__title">${SWEET.title}</h2>
      <span class="section__dots"></span>
      <span class="section__tag">one, done well</span>
    </div>
    <div class="feature">
      <div class="feature__name">${SWEET.name} <span class="dish__new" style="font-size:13pt">(new)</span></div>
      <div class="feature__desc">${SWEET.desc}</div>
    </div>
  </div>` +
  `<div class="section">
    <div class="section__head">
      <span class="section__no">08</span>
      <h2 class="section__title">${BAR.title}</h2>
      <span class="section__dots"></span>
      <span class="section__tag">gin · whiskey · vodka</span>
    </div>
    <div class="bar">${barHTML}</div>
  </div>` +
  `<div class="colophon">
    The Daily · Pranjal's home kitchen · Vegetarian · Cooked on stovetop &amp; air fryer<br>
    Draft v1 — visual direction to be set from reference · Set your own two inks in the CSS variables
  </div>`
);

document.getElementById("book").innerHTML = cover + p2 + p3 + p4 + p5;
</script>
